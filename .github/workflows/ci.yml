name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-ml-service:
    name: Python ml-service (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mlops_service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest tests/ -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: ESLint (informational only)
        run: npm run lint:eslint
        continue-on-error: true

      - name: Build
        run: npm run build
